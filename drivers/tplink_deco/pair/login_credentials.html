<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript" src="/homey.js"></script>
    <style>
      body {
        padding: 0 16px 24px;
        font-family: var(--homey-font-family, -apple-system, sans-serif);
      }
      .logo-row { text-align: center; margin: 8px 0 4px; }
      .logo-row img { width: 96px; height: auto; }
      .section { margin: 16px 0; }
      .hint {
        font-size: 12px;
        color: var(--homey-color-mono-600, #666);
        margin-top: 4px;
      }
      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        display: none;
        white-space: pre-wrap;
      }
      .status-error { background: #f8d7da; color: #721c24; }
      .status-info  { background: var(--homey-color-mono-050, #f5f5f5); color: var(--homey-color-mono-700, #444); }
      button[disabled] { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="logo-row">
      <img src="../../../assets/logo.png" alt="" onerror="this.style.display='none'" />
    </div>

    <div class="section">
      <h2 class="homey-title" id="title">Add your IP or hostname and password</h2>
    </div>

    <div class="homey-form-group section">
      <label class="homey-form-label" for="host-input" id="host-label">Hostname / IP</label>
      <input
        type="text"
        id="host-input"
        class="homey-form-input"
        placeholder="tplinkdeco.net"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
      />
      <div class="hint" id="host-hint">
        The IP address of your main Deco, e.g. 192.168.68.1
      </div>
    </div>

    <div class="homey-form-group section">
      <label class="homey-form-label" for="password-input" id="password-label">Password</label>
      <input type="password" id="password-input" class="homey-form-input" />
      <div class="hint" id="password-hint">
        The same password you use to sign in at tplinkdeco.net in a browser.
      </div>
    </div>

    <div class="section">
      <button id="login-btn" class="homey-button-primary-full">Log in</button>
      <div id="status" class="status"></div>
    </div>

    <script type="text/javascript">
      // ---------------------------------------------------------------------
      // This view deliberately replaces Homey's built-in `login_credentials`
      // pairing template.
      //
      // The built-in template's own script calls Homey.getCurrentView() and
      // Homey.error(), neither of which exists on every Homey pairing client —
      // confirmed by a user on my.homey.app web pairing, whose browser console
      // showed "TypeError: Homey.getCurrentView is not a function" and
      // "TypeError: Homey.error is not a function" the moment Log in was
      // pressed. The TypeError aborts the template's submit handler, so the
      // login never completes on the frontend even though the backend has
      // already authenticated and built the full device list. The user is
      // bounced back to the add-device screen with no error message, and
      // (because the pairing session is left half-dead) can't reopen the login
      // view without restarting the app. That single frontend crash accounts
      // for the large majority of "login works, nothing gets added" reports.
      //
      // Everything below therefore assumes NOTHING about the client's API
      // surface beyond Homey.ready() and Homey.emit(). Every other call is
      // feature-detected, and every failure path renders into our own DOM
      // instead of going through a Homey.* helper that might not be there.
      // ---------------------------------------------------------------------

      var busy = false;
      // Remembered so setBusy() can restore the localized label instead of
      // overwriting it with the English default after the first failure.
      var loginLabel = 'Log in';

      /**
       * Homey.emit() has two incompatible signatures in the wild: SDK v3's
       * homey.js returns a Promise from emit(event, data), while some clients
       * only implement the v2-style emit(event, data, callback) and throw
       * "Homey.emit is not a function" on a 2-arg call. Always pass the
       * callback AND chain on whatever (if anything) is returned, wrapped in
       * try/catch so a hard signature mismatch rejects instead of throwing.
       * Same wrapper as login_failed.html — see v1.4.58.
       */
      function emit(event, data) {
        return new Promise(function (resolve, reject) {
          try {
            var maybePromise = Homey.emit(event, data, function (err, result) {
              if (err) reject(err);
              else resolve(result);
            });
            if (maybePromise && typeof maybePromise.then === 'function') {
              maybePromise.then(resolve, reject);
            }
          } catch (e) {
            reject(e);
          }
        });
      }

      /**
       * Navigates to another pairing view, trying the client-side methods first
       * and falling back to asking the backend to do it. Never throws: if every
       * route is unavailable the caller still gets a resolved promise and the
       * status message stays on screen, which beats a silent dead end.
       */
      function goTo(viewId) {
        var viaBackend = function () {
          return emit('goto_view', viewId).catch(function () {});
        };
        try {
          if (typeof Homey.showView === 'function') {
            var r = Homey.showView(viewId);
            // Route an async rejection to the backend too. Swallowing it here
            // meant the fallback only ever ran when the method was missing or
            // threw synchronously — so a client whose showView() returns a
            // rejecting promise got no navigation at all and no second attempt.
            return r && typeof r.then === 'function' ? r.catch(viaBackend) : Promise.resolve();
          }
        } catch (e) {
          /* fall through to the backend route */
        }
        return viaBackend();
      }

      function setStatus(kind, message) {
        var el = document.getElementById('status');
        el.className = 'status status-' + kind;
        el.textContent = message;
        el.style.display = message ? 'block' : 'none';
      }

      function setBusy(state) {
        busy = state;
        var btn = document.getElementById('login-btn');
        btn.disabled = state;
        btn.textContent = state ? 'Logging in…' : loginLabel;
      }

      /**
       * Applies the localized labels the driver supplies, so this custom view
       * keeps the translations that the built-in template used to render.
       * Missing keys simply leave the English defaults in place.
       */
      function applyTexts(texts) {
        if (!texts) return;
        var map = {
          title: 'title',
          hostLabel: 'host-label',
          hostPlaceholder: null,
          hostHint: 'host-hint',
          passwordLabel: 'password-label',
          passwordHint: 'password-hint',
          loginButton: 'login-btn',
        };
        Object.keys(map).forEach(function (key) {
          if (!texts[key] || !map[key]) return;
          var el = document.getElementById(map[key]);
          if (el) el.textContent = texts[key];
          if (key === 'loginButton') loginLabel = texts[key];
        });
        if (texts.hostPlaceholder) {
          document.getElementById('host-input').placeholder = texts.hostPlaceholder;
        }
      }

      function submit() {
        if (busy) return;

        var host = document.getElementById('host-input').value.trim();
        var password = document.getElementById('password-input').value;

        if (!host) {
          setStatus('error', 'Enter the IP address or hostname of your main Deco.');
          return;
        }
        if (!password) {
          setStatus('error', 'Enter your Deco password.');
          return;
        }

        setBusy(true);
        setStatus('info', 'Contacting your Deco… this can take up to half a minute on a large mesh.');

        emit('login', { username: host, password: password })
          .then(function (result) {
            // The driver returns an explicit {ok, view} instead of a bare
            // boolean so navigation is decided here, on the frontend, rather
            // than depending on session.showView() succeeding in the backend.
            var ok = result === true || (result && result.ok === true);
            var view = (result && result.view) || (ok ? 'list_devices' : 'login_failed');

            if (ok) {
              setStatus('info', 'Connected. Loading your Deco nodes…');
              // Deliberately leave the button disabled.
              //
              // Re-enabling it here was worse than the dead end it was meant to
              // avoid: on the normal path goTo() resolves before navigation has
              // landed, so the user would briefly see an armed "Log in" button
              // next to a message inviting them to try again — and every extra
              // attempt spends one of the router's ten before it locks the
              // account, which is the failure this release exists to stop. If
              // the view is already gone, touching the DOM would throw instead.
              //
              // Navigation is best-effort; if it silently fails the user still
              // has the pairing dialog's own close control, and the wording says
              // what to do without suggesting another login.
              return goTo(view).then(function () {
                if (!document.getElementById('login-btn')) return;
                setStatus(
                  'info',
                  'Logged in. Loading your Deco nodes… if this screen stays here, close it and start Add device again.',
                );
              });
            }
            setBusy(false);
            if (result && result.message) setStatus('error', result.message);
            return goTo(view);
          })
          .catch(function (err) {
            setBusy(false);
            var message =
              (err && (err.message || err.error)) ||
              (typeof err === 'string' ? err : '') ||
              'Login failed. Check the IP address and password and try again.';
            setStatus('error', message);
          });
      }

      function onHomeyReady(Homey) {
        // Call ready() before anything else can throw. If it were deferred to
        // the end of this function and any statement below failed, the pairing
        // view would hang on Homey's own loading spinner forever.
        Homey.ready();

        document.getElementById('login-btn').addEventListener('click', submit);
        document.getElementById('password-input').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submit();
        });
        document.getElementById('host-input').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') document.getElementById('password-input').focus();
        });

        // Localized strings and any remembered hostname are fetched after
        // ready() so a failure here degrades to English defaults instead of
        // blocking the view.
        emit('get_login_texts', null)
          .then(function (data) {
            applyTexts(data && data.texts);
            if (data && data.hostname) {
              document.getElementById('host-input').value = data.hostname;
            }
          })
          .catch(function () {
            /* keep the English defaults */
          });
      }
    </script>
  </body>
</html>
