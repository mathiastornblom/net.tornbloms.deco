<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: var(--homey-text-color, #1a1a1a);
      padding: 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      body { --_text: #ffffff; --_subtle: rgba(255,255,255,0.55); }
    }
    @media (prefers-color-scheme: light) {
      body { --_text: #1a1a1a; --_subtle: rgba(0,0,0,0.45); }
    }

    /* ── Speed row ── */
    .speeds {
      display: flex;
      align-items: baseline;
      gap: 20px;
      margin-bottom: 6px;
    }

    .speed-block {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .arrow {
      font-size: 18px;
      line-height: 1;
      opacity: 0.7;
    }
    .arrow.down { color: #4cd964; }
    .arrow.up   { color: #007aff; }

    .speed-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--homey-text-color, var(--_text));
    }

    .speed-unit {
      font-size: 13px;
      opacity: 0.55;
      color: var(--homey-text-color, var(--_text));
    }

    /* ── Footer ── */
    .footer {
      font-size: 13px;
      opacity: 0.55;
      color: var(--homey-text-color, var(--_text));
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4cd964;
      flex-shrink: 0;
    }

    /* ── Error ── */
    .error {
      font-size: 13px;
      opacity: 0.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    'use strict';

    const root = document.getElementById('root');
    let pollTimer = null;

    // ── Helpers ─────────────────────────────────────────────────────────────

    // Convert KB/s to a human-readable string
    function formatSpeed(kbps) {
      if (kbps >= 1024) {
        return { value: (kbps / 1024).toFixed(1), unit: 'MB/s' };
      }
      return { value: Math.round(kbps).toString(), unit: 'KB/s' };
    }

    // ── Render ───────────────────────────────────────────────────────────────

    function render(data) {
      const down = formatSpeed(data.totalDown || 0);
      const up   = formatSpeed(data.totalUp   || 0);
      const clients = data.totalClients || 0;

      root.innerHTML = `
        <div class="speeds">
          <div class="speed-block">
            <span class="arrow down">↓</span>
            <span class="speed-value">${down.value}</span>
            <span class="speed-unit">${down.unit}</span>
          </div>
          <div class="speed-block">
            <span class="arrow up">↑</span>
            <span class="speed-value">${up.value}</span>
            <span class="speed-unit">${up.unit}</span>
          </div>
        </div>
        <div class="footer">
          <span class="footer-dot"></span>
          <span>${clients} device${clients !== 1 ? 's' : ''} connected</span>
        </div>
      `;
    }

    function renderError() {
      root.innerHTML = `<div class="error">Could not load network stats</div>`;
    }

    // ── Main logic ───────────────────────────────────────────────────────────

    async function refresh() {
      try {
        const data = await Homey.api('GET', '/stats', {});
        if (data) render(data);
        else renderError();
      } catch (_) {
        renderError();
      }
    }

    async function init() {
      // Call Homey.ready() before any awaited call, not after. A user reported
      // this widget showing nothing but a spinning icon: if any of the awaits
      // below never settles — which is the same failure the login_failed pairing
      // view hit — ready() is never reached and Homey keeps its loading state
      // forever. Signalling readiness first costs nothing; the content renders
      // into the widget as it arrives, and a failure shows an error instead of a
      // spinner that never stops.
      try {
        Homey.ready();
      } catch (_) {
        /* older clients may not expose ready() — nothing to do */
      }

      Homey.setHeight(80);
      await refresh();

      // Poll every 15 s — speeds change fast
      clearInterval(pollTimer);
      pollTimer = setInterval(refresh, 15000);
    }

    init();
  </script>
</body>
</html>
